# CI：每次 PR 与 main 推送自动验证（G1 起生效）。
# 分阶段能力：G1 起 = 构建 + 单测 + 格式 + 前端构建；
# P2 出现 scripts/smoke_api.sh 后自动追加端到端 smoke job（hashFiles 条件）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 clang-format（与本地同为 pip 源，版本对齐）
        run: pip install clang-format
      - name: 构建
        run: cmake -S . -B build && cmake --build build -j2
      - name: 单测（ctest）
        run: ctest --test-dir build --output-on-failure
      - name: 格式检查
        run: ./scripts/format_check.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm ci
      - name: 构建
        run: npm run build

  # P2 起自动启用：scripts/smoke_api.sh 出现后，该 job 对 17 端点做端到端断言。
  # smoke_api.sh 约定：自行启动 ./build/backend/merging_server（端口自选）并在结束时清理。
  smoke:
    runs-on: ubuntu-latest
    needs: backend
    if: hashFiles('scripts/smoke_api.sh') != ''
    steps:
      - uses: actions/checkout@v4
      - name: 构建
        run: cmake -S . -B build && cmake --build build -j2
      - name: 端到端 smoke
        run: ./scripts/smoke_api.sh
